  .card>summary::after{content:"▸";margin-left:auto;color:var(--muted)}

  textarea:focus{outline:2px solid #b89a6f}

// ─────────────────────── 渲染 + 批注持久化 ───────────────────────
const LS_KEY = "ch1-review-v1";
const saveStatus = document.getElementById("saveStatus");
const main = document.getElementById("main");

let notes = {};
try { notes = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch(e){ notes={}; }

const ST_LABEL = { done:["已实现","st-done"], part:["部分","st-part"], todo:["待施工/待拍板","st-todo"], confirm:["待确认","st-confirm"] };

const STATUS_LABEL = { done:"已实现", part:"部分", todo:"待施工", confirm:"待确认" };

function persist(){ localStorage.setItem(LS_KEY, JSON.stringify(notes)); flash("✓ 已保存 " + new Date().toLocaleTimeString()); }
function flash(t){ saveStatus.textContent = t; }

function cardHtml(it){
  const tag = ST_LABEL[it.st] ? `<span class="tag ${ST_LABEL[it.st][1]}">${ST_LABEL[it.st][0]}</span>` : "";
  const hasNote = (notes[it.id]||"").trim().length>0;
  const idx = it.idx ? `<span class="idx">${it.idx}</span>` : "";
  const meta = it.meta ? `<div class="meta">${it.meta}</div>` : "";
  const note = notes[it.id] || "";
  const noteBadge = hasNote ? ` <span class="tag st-todo">已批改</span>` : "";
  return `<details class="card" data-id="${it.id}" data-st="${it.st}">
    <summary>${idx}<span class="tt">${it.t}</span>${tag}${noteBadge}</summary>
    <div class="detail">
      ${meta}
      <div>${it.body}</div>
      <details class="reviewbox">
        <summary>✎ 写批改${hasNote?"（有批注）":""}</summary>
        <textarea data-n="${it.id}" placeholder="在这里写下你的意见 / 修改 / 确认……（自动保存）">${escapeHtml(note)}</textarea>
        <div class="saved"></div>
      </details>
    </div>
  </details>`;
}

function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function render(filter){
  main.innerHTML = "";
  SECTIONS.forEach(sec=>{
    const group = ITEMS.filter(i=>i.sec===sec.id);
    if(!group.length) return;
    const h = document.createElement("div");
    h.innerHTML = `<div class="sec">${sec.title}</div>${sec.desc?`<div class="sec desc">${sec.desc}</div>`:""}`;
    main.appendChild(h);
    group.forEach(it=>{
      if(filter!=="all" && filter!=="reviewed"){
        if(filter==="done" && it.st!=="done") return;
        if(filter==="part" && it.st!=="part") return;
        if(filter==="todo" && !["todo","confirm"].includes(it.st)) return;
      }
      if(filter==="reviewed" && !(notes[it.id]||"").trim()) return;
      const el = document.createElement("div");
      el.innerHTML = cardHtml(it);
      main.appendChild(el.firstElementChild);
    });
  });
  bind();
}

function bind(){
  // 过滤下手动补一次显示状态（含无 item 的卡）不处理
  main.querySelectorAll("textarea").forEach(ta=>{
    ta.addEventListener("input", ()=>{ notes[ta.dataset.n]=ta.value; persist(); });
    ta.addEventListener("blur", persist);
  });
}

// 过滤按钮
document.getElementById("filterNav").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#filterNav button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  const f=b.dataset.f; render(f);
});

// 导出：把所有批注拼成带分组的 Markdown
function collectMd(){
  let out = "# 《归星物语》第一章《归园新序》制作人批改记录\n\n";
  out += "> 来源：人工审核 · 数据对应 docs/reports/第一章剧情总结-v1.0-2026-08-16.md\n\n";
  let any = false; let groupT = false;
  SECTIONS.forEach(sec=>{
    const group = ITEMS.filter(i=>i.sec===sec.id);
    const reviewed = group.filter(i=> (notes[i.id]||"").trim());
    if(!reviewed.length) return;
    if(!groupT){ any=true; groupT=true; }
    out += `## ${sec.title}\n`;
    reviewed.forEach(i=>{
      out += `### ${i.idx?i.idx+" ":""}${i.t}（${STATUS_LABEL[i.st]||""}）\n`;
      out += `【正文】${i.body}\n\n`;
      out += `【批改】${notes[i.id].trim()}\n\n`;
    });
    out += "\n";
  });
  if(!any) out += "（暂无批改记录）\n";
  return out;
}
function exportReview(){
  const md = collectMd();
  const out = document.getElementById("exportOutput");
  out.style.display="block"; out.value=md;
  out.scrollIntoView({behavior:"smooth"});
  download("第一章批改记录.md", md);
}
function copyReview(){
  const md = collectMd();
  navigator.clipboard.writeText(md).then(()=>flash("✓ 已复制批改到剪贴板")).catch(()=>flash("❌ 复制失败，见下方导出框"));
  const out = document.getElementById("exportOutput"); out.style.display="block"; out.value=md;
}
function download(name, text){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"text/markdown"}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function resetReview(){
  if(!confirm("确定清空全部批注？此操作不可撤销。")) return;
  notes={}; localStorage.removeItem(LS_KEY); render("all"); flash("已清空全部批注");
}

render("all");
</script>
</body>
