  ["sys","（阿风把一盘菜推到老张面前。老张看了一眼，没说话，夹了一筷子。）"],
  ["sys","（远处，灯塔忽然亮了一下。不是庆典的光，就是亮了一下。）",1,"评审 P1：'不是庆典的光'否定式解释可删，后句已克制（待拍板）"],
  ["sys","（林澈看过去。）"],
  ["sys","（没有说话。）"],
  ["sys","（记忆卡）多年以后，青禾镇又晒起了今年的收成。",1,"完成世界反馈"],
  ["sys","（UI）青禾晒场已恢复。"],
]},
];

const LS_KEY = "ch1-dlg-review-v1";
let notes={}; try{ notes=JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){}
const saveEl=document.getElementById("saveStatus");
function flash(t){ saveEl.textContent=t; }
function persist(){ localStorage.setItem(LS_KEY, JSON.stringify(notes)); flash("已保存 "+new Date().toLocaleTimeString()); }
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const WHO={sys:"旁白",lc:"林澈",xy:"夏雅",ed:"镇长",mg:"老张",mm:"小梅",ah:"阿风",op:"选项",va:"镇民甲",vb:"镇民乙",mo:"小孩他娘",ki:"小孩",od:"老人",o2:"另一老人"};
const WHO_CLS={lc:"linche",sys:"system",xy:"xiya",ed:"elder"};
let sid=0;
const idOf=(s,l)=>s+"__"+l;

function render(filter){
  main.innerHTML="";
  SCENES.forEach((sc,si)=>{
    const visibleLines=sc.lines.filter((_,li)=>{
      if(filter==="all") return true;
      const n=notes[idOf(si,li)]||"";
      if(filter==="rev") return !!n.trim();
      if(filter==="need") return !!sc.lines[li][3]; // 仅带 ◆ 评审标注的行
    });
    if(!visibleLines.length) return;
    const h=document.createElement("div");
    h.innerHTML=`<div class="scene">${sc.title}<span class="cnt">${visibleLines.length} 句</span></div>`;
    main.appendChild(h);
    visibleLines.forEach((ln,vi)=>{
      const [st,tx,tag,note]=ln;
      const who=WHO[st]||st;
      const id=idOf(si, sc.lines.indexOf(ln));
      const hasRev=!!(notes[id]||"").trim();
      const tagBadge=tag?` <span style="color:#a03a3a;font-size:11px">【${tag}】</span>`:"";
      const noteHint=note?` <span style="color:#8a6a45;font-size:11px" title="${esc(note)}">◆</span>`:"";
      const div=document.createElement("div");
      div.className="line";
      div.innerHTML=`<span class="no"></span><span class="who ${WHO_CLS[st]||""}">${who}</span>`+
        `<span class="tx">${tagBadge}${noteHint}<span class="${st==='sys'?'stage':''}">${esc(tx)}</span></span>`+
        `<span class="rev${hasRev?' open':''}"><span class="dot" title="写批改">${hasRev?'●':'✎'}</span>`+
        `<textarea placeholder="逐句批改（自动保存）">${esc(notes[id]||"")}</textarea></span>`;
      main.appendChild(div);
      // 绑定
      const rev=div.querySelector(".rev");
      const dot=rev.querySelector(".dot");
      const ta=rev.querySelector("textarea");
      dot.addEventListener("click",(e)=>{ e.stopPropagation(); rev.classList.toggle("open"); if(rev.classList.contains("open")) ta.focus(); });
      ta.addEventListener("input",()=>{ notes[id]=ta.value; persist(); });
      ta.addEventListener("blur",()=>{ persist(); });
    });
  });
}

document.getElementById("filterNav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#filterNav button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); render(b.dataset.f);
});

function collectMd(filter){
  let out="# 第一章《归园新序》逐句批改（导出）\n\n> 数据对应 docs/design/第一章逐句剧本稿-v1.0\n\n";
  let any=false;
  SCENES.forEach((sc,si)=>{
    const rows=[];
    sc.lines.forEach((ln,li)=>{
      const n=(notes[idOf(si,li)]||"").trim();
      if(!n) return;
      any=true;
      const [st,tx]=ln;
      rows.push(`- ${WHO[st]||st}｜${tx}\n  ↳ 批改：${n}`);
    });
    if(rows.length){ out+=`## ${sc.title}\n\n${rows.join("\n\n")}\n\n`; }
  });
  if(!any) out+="（暂无批改）\n";
  return out;
}
function download(name,text){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/markdown"})); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function exportReview(){
  const md=collectMd();
  const out=document.getElementById("exportOut");
  out.style.display="block"; out.value=md; out.scrollIntoView({behavior:"smooth"});
  download("第一章逐句批改.md",md);
}
function resetReview(){ if(!confirm("清空全部逐句批注？不可撤销。")) return; notes={}; localStorage.removeItem(LS_KEY); render("all"); flash("已清空"); }

render("all");
</script>
</body>
